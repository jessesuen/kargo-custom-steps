apiVersion: ee.kargo.akuity.io/v1alpha1
kind: CustomPromotionStep
metadata:
  name: trivy-image
spec:
  image: ghcr.io/jessesuen/trivy:0.69.3
  command:
  - trivy
  - image
  - --format=template
  - --template='{{range .}}{{range .Vulnerabilities}}{{.VulnerabilityID}} ({{.PkgName}}){{"\n"}}{{end}}{{end}}'
  - --severity=CRITICAL
  - ${{ config.image }}
