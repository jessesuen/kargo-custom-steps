# Runs conftest against a set of kubernetes manifests using remote policy
apiVersion: ee.kargo.akuity.io/v1alpha1
kind: CustomPromotionStep
metadata:
  name: conftest
spec:
  image: openpolicyagent/conftest:v0.67.0
  command:
  - sh
  - -c
  - |
    conftest pull https://raw.githubusercontent.com/jessesuen/kargo-custom-steps/master/policy/kubernetes.rego && \
    conftest test ${{ config.path }}
